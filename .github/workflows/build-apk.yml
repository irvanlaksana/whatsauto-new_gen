name: Build Android APK

on:
  push:
    branches: ["main", "master", "arena/**"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test + build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Capacitor 8 memakai AGP 8.13 dengan sourceCompatibility Java 21.
      # Build dengan JDK 17 akan gagal — inilah penyebab build lama merah.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "zulu"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (TypeScript)
        run: npm test

      - name: Type check + build web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make sure SDK packages are present
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Compile + unit test Java native
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee gradle.log
          exit ${PIPESTATUS[0]}

      - name: Build Android APK (debug)
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee -a gradle.log
          exit ${PIPESTATUS[0]}

      - name: Publish failure log
        if: failure()
        run: |
          mkdir -p ci-debug
          {
            echo "# Gradle log — run $GITHUB_RUN_ID ($GITHUB_SHA)"
            echo
            echo '```'
            tail -n 250 android/gradle.log 2>/dev/null || echo "(log gradle tidak ditemukan)"
            echo '```'
          } > ci-debug/gradle.log
          cat ci-debug/gradle.log >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-debug/gradle.log
          git commit -m "chore(ci): publish gradle failure log [skip ci]" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true

      - name: Upload Java unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: whatsauto-sheet-sync-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
